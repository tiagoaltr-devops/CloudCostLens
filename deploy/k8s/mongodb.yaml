apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: cloudcostlens
spec:
  replicas: 1
  selector:
    matchLabels: { app: mongodb }
  template:
    metadata:
      labels: { app: mongodb }
    spec:
      containers:
      - name: mongodb
        image: mongo:7
        ports: [{ containerPort: 27017 }]
        resources:
          requests: { cpu: "50m", memory: "128Mi" }
          limits: { cpu: "200m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: cloudcostlens
spec:
  selector: { app: mongodb }
  ports: [{ port: 27017, targetPort: 27017 }]
